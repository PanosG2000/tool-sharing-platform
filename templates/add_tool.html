<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>Προσθήκη Εργαλείου</title>
</head>
<body>

    <h1>Προσθήκη Εργαλείου</h1>

    <form method="POST">

        <label for="name">Όνομα εργαλείου:</label><br>
        <input type="text" id="name" name="name" required>

        <br><br>

        <label for="description">Περιγραφή:</label><br>
        <textarea id="description" name="description" required></textarea>

        <br><br>

        <button type="submit">Προσθήκη</button>

    </form>

    <br>

    <a href="/">Επιστροφή στα εργαλεία</a>

</body>
</html>
